name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: main
          filters: |
            frontend:
              - 'src/**'
              - 'static/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vite.config.ts'
              - 'svelte.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'eslint.config.ts'
              - '.prettierrc'
              - '.prettierignore'
              - '.github/workflows/ci.yml'
            backend:
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.github/workflows/ci.yml'

  frontend:
    name: Validate Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: I18n
        run: pnpm run i18n:compile

      - name: Lint
        run: pnpm run lint:frontend

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

  backend:
    name: Validate Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            build-essential \
            curl wget file

      - name: Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Format
        run: cargo fmt --manifest-path Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path Cargo.toml --workspace --all-targets -- -D warnings

      - name: Check
        run: cargo check --manifest-path Cargo.toml --workspace

  ci-passed:
    name: Passed
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend]
    if: always()

    steps:
      - name: Evaluate Results
        run: |
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend:  ${{ needs.backend.result }}"

          if [[ "${{ needs.frontend.result }}" =~ ^(failure|cancelled)$ ]] || \
             [[ "${{ needs.backend.result }}" =~ ^(failure|cancelled)$ ]]; then
            echo "::error::One or more essential checks failed."
            exit 1
          fi
          echo "All checks passed or were safely skipped!"
          exit 0
