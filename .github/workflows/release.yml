name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g. v1.2.3). The tag must already exist and match the app version in tauri.conf.json / Cargo.toml."
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            bundle-glob: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/appimage/*.AppImage.sig
              target/release/bundle/deb/*.deb
              target/release/bundle/deb/*.deb.sig
              target/release/bundle/rpm/*.rpm
              target/release/bundle/rpm/*.rpm.sig
          - target: macos-arm64
            os: macos-latest
            bundle-glob: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app.tar.gz
              target/release/bundle/macos/*.app.tar.gz.sig
          - target: windows-x86_64
            os: windows-latest
            bundle-glob: |
              target/release/bundle/msi/*.msi
              target/release/bundle/msi/*.msi.sig
              target/release/bundle/nsis/*-setup.exe
              target/release/bundle/nsis/*-setup.exe.sig

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup
        uses: pnpm/setup@v2
        with:
          runtime: node@24

      - name: Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Dependencies
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Frontend
        run: pnpm install --frozen-lockfile

      - name: Verify
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::App version ($APP_VERSION) does not match tag version ($TAG_VERSION). Run 'pnpm release' first."
              exit 1
            fi
          else
            if ! git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
              echo "::error::Tag ${{ inputs.version }} does not exist. Create and push it first (e.g. 'pnpm release')."
              exit 1
            fi
          fi
          echo "App version: $APP_VERSION"

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          releaseName: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.bundle-glob }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Update
        run: gh release edit ${{ github.ref_name }} --notes-file CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
