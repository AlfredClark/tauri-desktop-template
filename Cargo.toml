# 虚拟工作区
[workspace]
members = ["src-tauri"]
resolver = "3"

# 全局 lints 配置为 warn
[workspace.lints.rust]
warnings = "warn"

[workspace.lints.clippy]
all = "warn"

# 配置全局 profile
[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 3
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 0

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false