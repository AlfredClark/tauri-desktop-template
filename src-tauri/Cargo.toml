[package]
name = "tauri-desktop-template"
version = "0.1.0"
description = "Tauri based desktop application development template"
authors = ["Alfred Clark"]
license = "GPL-3.0-only"
repository = "https://github.com/alfredclark/tauri-desktop-template"
keywords = ["tauri", "desktop", "template"]
categories = ["gui", "development-tools::templates"]
readme = "../README.md"
edition = "2024"

[lib]
name = "tauri_desktop_template_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
log = "0.4.33"
rust-i18n = "4.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-store = "2.4.4"
